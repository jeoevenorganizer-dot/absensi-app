<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Absensi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f6f9; }
    h2 { color: #333; }
    .filter-container { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; }
    .btn { background-color: #107c41; color: white; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #2e7d32; color: white; }
    img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    #main-content { display: none; }
  </style>
</head>
<body>

  <div id="main-content">
    <h2>Dashboard Rekap Absensi Bulanan</h2>
    
    <!-- Filter Bulan dan Tahun -->
    <div class="filter-container">
      <label for="filter-bulan"><strong>Pilih Periode:</strong></label>
      <select id="filter-bulan">
        <option value="01">Januari</option>
        <option value="02">Februari</option>
        <option value="03">Maret</option>
        <option value="04">April</option>
        <option value="05">Mei</option>
        <option value="06">Juni</option>
        <option value="07">Juli</option>
        <option value="08">Agustus</option>
        <option value="09">September</option>
        <option value="10">Oktober</option>
        <option value="11">November</option>
        <option value="12">Desember</option>
      </select>
      
      <select id="filter-tahun"></select>
      
      <button class="btn" onclick="loadData()">Tampilkan Data</button>
      <button class="btn" style="background-color: #2e7d32;" onclick="downloadExcel()">Download Excel</button>
    </div>

    <table id="tabel-absensi">
      <thead>
        <tr>
          <th>No</th>
          <th>Waktu</th>
          <th>Nama</th>
          <th>Foto</th>
          <th>Lokasi GPS</th>
        </tr>
      </thead>
      <tbody id="data-absensi">
        <tr><td colspan="5">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const ADMIN_PASSWORD = "hanyaadmin"; // Sesuaikan password admin Anda
    const SUPABASE_URL = 'https://gbrbgvjegakneaplcmuu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdicmJndmplZ2FrbmVhcGxjbXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MjQyNDcsImV4cCI6MjEwNjEwMDI0N30.ZtwH_G9C10K5kF2SFvpth2cuz25cu4zW-czyCoy4pWo';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let rawData = [];

    function checkAuth() {
      const inputPass = prompt("Masukkan Kata Sandi Admin:");
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('main-content').style.display = 'block';
        initFilters();
        loadData();
      } else {
        alert("Kata sandi salah! Akses ditolak.");
        window.location.href = "index.html";
      }
    }

    function initFilters() {
      const today = new Date();
      const currentMonth = String(today.getMonth() + 1).padStart(2, '0');
      const currentYear = today.getFullYear();

      document.getElementById('filter-bulan').value = currentMonth;

      const tahunSelect = document.getElementById('filter-tahun');
      for (let y = currentYear - 2; y <= currentYear + 1; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        if (y === currentYear) opt.selected = true;
        tahunSelect.appendChild(opt);
      }
    }

    async function loadData() {
      const bulan = document.getElementById('filter-bulan').value;
      const tahun = document.getElementById('filter-tahun').value;

      // Hitung tanggal awal dan akhir bulan yang dipilih
      const startDate = `${tahun}-${bulan}-01T00:00:00.000Z`;
      const lastDay = new Date(tahun, bulan, 0).getDate();
      const endDate = `${tahun}-${bulan}-${lastDay}T23:59:59.999Z`;

      const tbody = document.getElementById('data-absensi');
      tbody.innerHTML = '<tr><td colspan="5">Memuat data...</td></tr>';

      const { data, error } = await supabaseClient
        .from('absensi')
        .select('*')
        .gte('created_at', startDate)
        .lte('created_at', endDate)
        .order('created_at', { ascending: false });

      if (error) {
        alert('Gagal mengambil data: ' + error.message);
        return;
      }

      rawData = data;
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">Tidak ada data absensi untuk bulan ini.</td></tr>';
        return;
      }

      data.forEach((row, index) => {
        const date = new Date(row.created_at).toLocaleString('id-ID');
        const mapsUrl = `https://www.google.com/maps?q=${row.lokasi}`;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${date}</td>
          <td>${row.nama || '-'}</td>
          <td><a href="${row.foto_url}" target="_blank"><img src="${row.foto_url}" alt="Foto"></a></td>
          <td><a href="${mapsUrl}" target="_blank">${row.lokasi || '-'}</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function downloadExcel() {
      if (rawData.length === 0) {
        alert('Tidak ada data untuk diunduh');
        return;
      }

      const bulan = document.getElementById('filter-bulan').value;
      const tahun = document.getElementById('filter-tahun').value;

      const excelData = rawData.map((item, index) => ({
        No: index + 1,
        Waktu: new Date(item.created_at).toLocaleString('id-ID'),
        Nama: item.nama,
        Foto_URL: item.foto_url,
        Lokasi: item.lokasi
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Absensi");
      XLSX.writeFile(workbook, `Rekap_Absensi_${bulan}_${tahun}.xlsx`);
    }

    checkAuth();
  </script>
</body>
</html>
