<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Absensi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f6f9; }
    h2 { color: #333; }
    .btn { padding: 10px 15px; background-color: #107c41; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #2e7d32; color: white; }
    img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    
    /* Sembunyikan konten sebelum login */
    #main-content { display: none; }
  </style>
</head>
<body>

  <div id="main-content">
    <h2>Dashboard Rekap Absensi</h2>
    <button class="btn" onclick="downloadExcel()">Download Excel</button>

    <table id="tabel-absensi">
      <thead>
        <tr>
          <th>No</th>
          <th>Waktu</th>
          <th>Nama</th>
          <th>Foto</th>
          <th>Lokasi GPS</th>
        </tr>
      </thead>
      <tbody id="data-absensi">
        <tr><td colspan="5">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // 1. ATUR PASSWORD ADMIN DI SINI
    const ADMIN_PASSWORD = "Reseprahasia123#"; // Ganti sesuai kata sandi yang Anda inginkan

    // 2. KREDENSIAL SUPABASE
    const SUPABASE_URL = 'https://gbrbgvjegakneaplcmuu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdicmJndmplZ2FrbmVhcGxjbXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MjQyNDcsImV4cCI6MjEwNjEwMDI0N30.ZtwH_G9C10K5kF2SFvpth2cuz25cu4zW-czyCoy4pWo';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let rawData = [];

    // Fungsi Verifikasi Password
    function checkAuth() {
      const inputPass = prompt("Masukkan Kata Sandi Admin:");
      
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('main-content').style.display = 'block';
        loadData();
      } else {
        alert("Kata sandi salah! Akses ditolak.");
        window.location.href = "index.html"; // Lempar kembali ke halaman utama
      }
    }

    async function loadData() {
      const { data, error } = await supabaseClient
        .from('absensi')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('Gagal mengambil data: ' + error.message);
        return;
      }

      rawData = data;
      const tbody = document.getElementById('data-absensi');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">Belum ada data absensi.</td></tr>';
        return;
      }

      data.forEach((row, index) => {
        const date = new Date(row.created_at).toLocaleString('id-ID');
        const mapsUrl = `https://www.google.com/maps?q=${row.lokasi}`;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${date}</td>
          <td>${row.nama || '-'}</td>
          <td><a href="${row.foto_url}" target="_blank"><img src="${row.foto_url}" alt="Foto"></a></td>
          <td><a href="${mapsUrl}" target="_blank">${row.lokasi || '-'}</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function downloadExcel() {
      if (rawData.length === 0) {
        alert('Tidak ada data untuk diunduh');
        return;
      }

      const excelData = rawData.map((item, index) => ({
        No: index + 1,
        Waktu: new Date(item.created_at).toLocaleString('id-ID'),
        Nama: item.nama,
        Foto_URL: item.foto_url,
        Lokasi: item.lokasi
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Absensi");
      XLSX.writeFile(workbook, "Rekap_Absensi.xlsx");
    }

    // Jalankan pemeriksaan kata sandi saat halaman dimuat
    checkAuth();
  </script>
</body>
</html>
